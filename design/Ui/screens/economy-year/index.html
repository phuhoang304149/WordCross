<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WordCross — coin &amp; chu kỳ 365 ngày</title><link rel="stylesheet" href="../../global/css/theme.css">
<style>
.eco-sim{background:var(--yellow-soft);color:#8a6200;font-weight:800;font-size:11px;text-align:center;padding:3px 10px;margin:0 14px 6px;border-radius:var(--r-pill)}
.coin-pill{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:var(--r-pill);background:var(--yellow-soft);font-weight:800;color:#8a6200}
.coin-dot{width:16px;height:16px;border-radius:50%;background:var(--yellow);border:3px solid var(--yellow-deep);display:inline-block}
.eco-tabs{display:flex;gap:6px;padding:0 14px 8px;overflow-x:auto}
.eco-body{flex:1;overflow:auto;padding:0 14px 14px}
.eco-card{background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.eco-card .grow{flex:1;min-width:0}.eco-card b{display:block;font-size:14px}.eco-card small{display:block;color:var(--ink-soft);font-weight:700;font-size:11px;margin-top:2px}
.eco-card .btn{min-height:38px;padding:0 14px;font-size:13px}
.eco-h{font-weight:800;font-size:13px;color:var(--ink-soft);margin:8px 2px 6px}
.eco-bar{height:8px;border-radius:var(--r-pill);background:var(--line);margin-top:5px;overflow:hidden}.eco-bar i{display:block;height:100%;background:var(--teal)}
.eco-log{font-size:11px;font-weight:700;color:var(--ink-soft);background:var(--card);border:2px dashed var(--line);border-radius:var(--r-s);padding:6px 8px;max-height:92px;overflow:auto}
.eco-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.eco-day{height:36px;border-radius:var(--r-s);background:var(--card);border:2px solid var(--line);font-weight:800;font-size:12px;position:relative}
.eco-day.ev{background:var(--coral-soft)}.eco-day.today{border-color:var(--teal)}.eco-day.sel{background:var(--teal);color:#fff}.eco-day.br{background:var(--yellow-soft)}
.eco-sel{height:38px;border-radius:var(--r-s);border:2px solid var(--line);background:var(--card);font:inherit;font-weight:800;padding:0 8px;max-width:100%}
.eco-pop{position:absolute;inset:0;z-index:70;background:rgba(31,45,61,.55);display:flex;align-items:center;justify-content:center;padding:24px}
.eco-pop .dlg{background:var(--card);border-radius:var(--r-l);padding:16px;width:100%;display:grid;gap:8px}
.eco-pop h3{font-size:17px}
.eco-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
</style></head>
<body data-page="economy-year"><div class="phone" id="eco"></div>
<script src="../../global/js/i18n.js"></script>
<script src="../../../GD/economy-year-data/bundle.js"></script>
<script src="economy.js"></script>
</body></html>
